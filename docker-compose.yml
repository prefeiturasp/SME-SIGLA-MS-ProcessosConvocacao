version: '3.8'

services:
  db:
    image: postgres:17
    container_name: postgresdb_processos_convocacao
    restart: unless-stopped
    environment:
      POSTGRES_DB: processos_convocacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - processos_convocacao_network

  redis:
    image: redis:7-alpine
    container_name: redis_processos_convocacao
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - processos_convocacao_network

  api:
    build: .
    container_name: api_processos_convocacao
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind=0.0.0.0:8001 -w 2
    env_file: .env
    environment:
      - CELERY_REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    networks:
      - processos_convocacao_network

  celery_worker:
    build: .
    container_name: celery_processos_convocacao
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=2 -n worker1@%h
    env_file: .env
    environment:
      - CELERY_REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
    depends_on:
      - db
      - redis
    networks:
      - processos_convocacao_network

volumes:
  postgres_data:

networks:
  processos_convocacao_network:
    driver: bridge